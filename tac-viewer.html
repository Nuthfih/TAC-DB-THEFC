<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAC · 3D models</title><style>
*{box-sizing:border-box}body{margin:0;background:#24211e;color:#f5ead4;font:15px system-ui;display:flex;flex-direction:column;height:100dvh}header{padding:14px 20px;border-bottom:1px solid #665638}h1{font-size:18px;margin:0 0 10px}#controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{background:#24201b;color:#e8c76a;border:1px solid #a98c49;border-radius:5px;padding:7px 10px;font:inherit}button{cursor:pointer}button:hover{background:#e8c76a;color:#24201b}canvas{display:block;width:100%;flex:1;min-height:180px;touch-action:none;background:radial-gradient(ellipse at 50% 45%,#514a40 0%,#282420 65%,#1c1a18 100%)}body.light canvas{background:radial-gradient(ellipse at 50% 45%,#fff9eb,#d3cbbd)}footer{padding:10px 20px;font-size:12px;color:#d6c9b4}p{margin:5px 0}#parts{display:flex;flex-wrap:wrap;gap:12px;padding:8px 0}summary{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #ffe4a1;outline-offset:3px}
</style></head><body><header><h1>3D models</h1><div id="controls"><label>Outfit <select id="outfit"></select></label><label>Background <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><button id="reset">Reset view</button></div></header><canvas id="view" aria-label="Rotate the character by dragging; scroll to zoom"></canvas><footer><p id="status" role="status">Loading model…</p><p>Drag to rotate · Scroll to zoom</p><details><summary>Preview details</summary><p id="note"></p><div id="parts"></div></details></footer><script>
(async()=>{try{
const params=new URLSearchParams(location.search),id=params.get('unit')||'thol';
if(!['thol','celes','zafirith'].includes(id))throw Error('Unknown character');
const res=await fetch('tac-models/'+id+'.json');if(!res.ok)throw Error('Model file unavailable: '+res.status);
const unit=await res.json(),chosen=Object.hasOwn(unit.outfits,params.get('outfit'))?params.get('outfit'):'default';
const parts=unit.outfits[chosen].parts;
document.querySelector('h1').textContent=unit.name+' · 3D models';document.title=unit.name+' · 3D models';document.getElementById('note').textContent=unit.note;
const sel=document.getElementById('outfit');for(const [key,o] of Object.entries(unit.outfits))sel.add(new Option(o.label,key));sel.value=chosen;sel.disabled=sel.options.length===1;
sel.onchange=e=>{params.set('outfit',e.target.value);location.search=params.toString()};
const theme=document.getElementById('theme');theme.onchange=e=>{document.body.classList.toggle('light',e.target.value==='light');try{sessionStorage.setItem('tacTheme',e.target.value)}catch{}};
try{if(sessionStorage.getItem('tacTheme')==='light'){document.body.classList.add('light');theme.value='light'}}catch{}
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{alpha:true});
if(!gl)throw Error('WebGL is unavailable in this browser');
function shader(type,s){let a=gl.createShader(type);gl.shaderSource(a,s);gl.compileShader(a);if(!gl.getShaderParameter(a,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(a));return a}
let prog=gl.createProgram();
gl.attachShader(prog,shader(gl.VERTEX_SHADER,`attribute vec3 p;attribute vec2 uv;uniform float yaw,pitch,zoom,aspect;varying vec2 t;void main(){vec3 q=p-vec3(0.,0.,.52);float x=cos(yaw)*q.x-sin(yaw)*q.y;float d=sin(yaw)*q.x+cos(yaw)*q.y;float z=cos(pitch)*q.z-sin(pitch)*d;float dep=sin(pitch)*q.z+cos(pitch)*d;gl_Position=vec4(x*zoom/aspect,z*zoom,dep*.5,1.);t=uv;}`));
gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,`precision mediump float;varying vec2 t;uniform sampler2D tex;void main(){vec4 c=texture2D(tex,t);if(c.a<.1)discard;gl_FragColor=c;}`));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
let yaw=0,pitch=.08,zoom=1.8;function fitZoom(){let maxX=.01;for(const p of parts)for(let i=0;i<p.data.length;i+=5)maxX=Math.max(maxX,Math.abs(p.data[i]));return Math.min(1.8,.9*(canvas.clientWidth/canvas.clientHeight)/maxX)}zoom=fitZoom();const pos=gl.getAttribLocation(prog,'p'),uv=gl.getAttribLocation(prog,'uv');gl.enableVertexAttribArray(pos);gl.enableVertexAttribArray(uv);gl.enable(gl.DEPTH_TEST);gl.clearColor(0,0,0,0);
for(const part of parts){part.visible=true;part.buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,part.buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(part.data),gl.STATIC_DRAW);part.tex=gl.createTexture();let im=new Image();im.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,part.tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);part.ready=true;if(parts.every(p=>p.ready))document.getElementById('status').textContent='';draw()};im.onerror=()=>{document.getElementById('status').textContent='A texture failed to load.'};im.src=part.texture;let lab=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=true;box.onchange=()=>{part.visible=box.checked;draw()};lab.append(box,part.name);document.querySelector('#parts').append(lab)}
function draw(){let d=Math.min(devicePixelRatio||1,2);canvas.width=canvas.clientWidth*d;canvas.height=canvas.clientHeight*d;gl.viewport(0,0,canvas.width,canvas.height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);for(const [k,v]of Object.entries({yaw,pitch,zoom,aspect:canvas.width/canvas.height}))gl.uniform1f(gl.getUniformLocation(prog,k),v);for(const part of parts){if(!part.visible||!part.ready)continue;gl.bindBuffer(gl.ARRAY_BUFFER,part.buffer);gl.vertexAttribPointer(pos,3,gl.FLOAT,false,20,0);gl.vertexAttribPointer(uv,2,gl.FLOAT,false,20,12);gl.bindTexture(gl.TEXTURE_2D,part.tex);gl.drawArrays(gl.TRIANGLES,0,part.data.length/5)}}
let last=null;canvas.onpointerdown=e=>{last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!last)return;yaw+=(e.clientX-last[0])*.01;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-last[1])*.01));last=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=()=>last=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.5,Math.min(6,zoom*Math.exp(-e.deltaY*.001)));draw()};document.querySelector('#reset').onclick=()=>{yaw=0;pitch=.08;zoom=fitZoom();draw()};window.onresize=draw;draw();

}catch(e){document.getElementById('status').textContent=e.message;console.error(e)}})();</script></body></html>
